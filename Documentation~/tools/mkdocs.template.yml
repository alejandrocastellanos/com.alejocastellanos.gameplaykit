site_name: Gameplay Kit
site_description: Modular 2D gameplay kit for Unity 6 — movement, combat, health, AI, environment, camera, managers and UI, assembled from Add Component.
site_author: Alejandro Castellanos
site_url: !ENV [SITE_URL, "https://alejandrocastellanos.github.io/com.alejocastellanos.gameplaykit/"]
repo_url: !ENV [REPO_URL, "https://github.com/alejandrocastellanos/com.alejocastellanos.gameplaykit"]
edit_uri: ""
copyright: Copyright &copy; 2026 Alejandro Castellanos — MIT License

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          site_description: Kit modular de gameplay 2D para Unity 6 — movimiento, combate, vida, IA, entorno, cámara, managers y UI, armado desde Add Component.
          nav_translations:
            Home: Inicio
            Guides: Guías
            Start here: Para empezar
            Platformer games: Juegos de plataformas
            Top-down games: Juegos top-down
            For both styles: Para los dos estilos
            Components: Componentes
            Reference: Referencia
            Core: Núcleo
            Movement: Movimiento
            Health & Physics: Vida y física
            Combat: Combate
            AI & Enemies: IA y enemigos
            Environment: Entorno
            Camera: Cámara
            Managers: Managers
            UI: UI
